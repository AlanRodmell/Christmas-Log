<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D92332"/>
      <stop offset="100%" stop-color="#A81421"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE17D"/>
      <stop offset="100%" stop-color="#E5A215"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed Santa red background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <!-- Subtle snowflake sparkles -->
  <circle cx="96" cy="112" r="8" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="418" cy="126" r="10" fill="#FFE17D" opacity="0.6"/>
  <circle cx="114" cy="402" r="7" fill="#FFE17D" opacity="0.5"/>
  <circle cx="404" cy="390" r="9" fill="#FFFFFF" opacity="0.45"/>
  <!-- Festive gift box inside safe zone -->
  <rect x="136" y="218" width="240" height="176" rx="22" fill="#FFFDF9"/>
  <!-- Gift lid -->
  <rect x="122" y="176" width="268" height="54" rx="16" fill="#FFFFFF"/>
  <!-- Lid shadow -->
  <rect x="136" y="226" width="240" height="10" fill="#E8D8C3" opacity="0.7"/>
  <!-- Vertical holly green ribbon -->
  <rect x="230" y="176" width="52" height="218" fill="#157A4B"/>
  <!-- Horizontal gold ribbon -->
  <rect x="136" y="286" width="240" height="36" fill="url(#goldRibbon)"/>
  <!-- Center knot -->
  <rect x="226" y="282" width="60" height="44" rx="10" fill="#F8C537"/>
  <!-- Top golden bow loops -->
  <path d="M256 178 C210 178 174 146 184 118 C194 92 234 110 256 156 Z" fill="url(#goldRibbon)"/>
  <path d="M256 178 C302 178 338 146 328 118 C318 92 278 110 256 156 Z" fill="url(#goldRibbon)"/>
  <!-- Center holly berries on bow -->
  <circle cx="256" cy="172" r="16" fill="#C61D2B"/>
  <circle cx="251" cy="167" r="4.5" fill="#FFFFFF" opacity="0.55"/>
</svg>
